[pytest]
# Registered so an unknown-marker warning cannot hide a typo'd marker, and
# deselected by default so a plain `pytest tests/` stays a few minutes rather than
# tens: `slow` is for tests that run a real multi-hour-simulation risk assessment
# (TRSET-13's 24-hour midnight-crossing run). Run them with `pytest -m slow`.
markers =
    slow: runs a long real simulation; deselected by default, run with -m slow
addopts = -m "not slow"
